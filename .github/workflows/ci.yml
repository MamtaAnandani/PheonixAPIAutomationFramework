name: Phoenix Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "30 18 * * *" # 18:30 UTC is 00:00 IST (Midnight) #Set the cron for midnight IST - git hub action supports the utc format, #the 1* means month 2*means week 3* means day 18:30 means 6:30 pm UTC and 12:00am IST
    - cron: "30 17 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
     inputs:
        env:
          description: "Environment"
          type: choice
          options: [qa,uat,dev]
          default: qa
          required: true
        suiteXmlFile:
          description: "TestNG Xml File"
          type: choice
          options: [testng.xml,smoke.xml,regression.xml,testng-datadriven.xml]
          default: testng.xml
          required: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Default Values for Exceution
      id: default
      run: |
           echo "suiteXmlFile=${{ github.event.inputs.suiteXmlFile || 'testng.xml' }}" >> "$GITHUB_OUTPUT"
           echo "env=${{ github.event.inputs.env || 'qa' }}" >> "$GITHUB_OUTPUT"

        
    - name: Execute Test Automation Framework
      run: mvn clean test -DsuiteXmlFile="${{ steps.default.outputs.suiteXmlFile }}" -Denv="${{ steps.default.outputs.env}}"

    - name: Upload a Build Artifact
      if: always()
      uses:  actions/upload-artifact@v4
      with:
        name: SureFire reports
        path: target/surefire-reports/
        retention-days: 10
      
      

  
