name: Phoenix Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # 18:30 UTC is 00:00 IST (Midnight) #Set the cron for midnight IST - git hub action supports the utc format
    - cron: "30 18 * * *"   #the 1* means month 2*means week 3* means day 18:30 means 6:30 pm UTC and 12:00am IST
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options: [qa, uat, dev]
        default: qa
        required: true

     suiteXmlFile:
       env:
         description: "TestNg XML File"
         type: choice
         options: [testng,xml, smoke.xml, regression.xml]
         default: testng.xml
         required: true

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Execute Test Automation Framework
      run: mvn clean test -DsuiteXmlFile="${{github.event.suiteXmlFile.env}}" -Denv="${{github.event.inputs.env}}"

    - name: Upload a Build Artifact
      if: always()
      uses:  actions/upload-artifact@v4
      with:
        name: SureFire reports
        path: target/surefire-reports/
        retention-days: 10
      
      

  
